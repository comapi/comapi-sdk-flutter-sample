name: dotdigital_push
description: "A Flutter plugin bridging the native Dotdigital (Comapi Foundation) Push SDK for Android and iOS."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dotdigital.push
        pluginClass: DotdigitalPushPlugin
      ios:
        pluginClass: DotdigitalPushPlugin
